[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nested-vla"
version = "0.1.0"
description = "Core algorithm for task-conditioned VLA parameter generation"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Guodong Du"},
  {name = "Wanyu Lin"},
]
dependencies = ["torch>=2.0"]

[tool.setuptools.packages.find]
include = ["nested_vla*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
